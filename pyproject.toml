[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locidx"
version = "0.1.0"
description = "Local-first code indexer and search. Zero-dependency CLI, TUI, and MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alwan Juliawan", email = "alwanjuliawan02@gmail.com" }]
keywords = ["code-search", "indexer", "grep", "mcp", "local-first", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
locidx = "locidx.cli:main"

[project.urls]
Homepage = "https://github.com/wenn-id/locidx"
Repository = "https://github.com/wenn-id/locidx"

[tool.setuptools]
packages = ["locidx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
